name: Gateway and workflow checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: orchestration/node-red/package-lock.json
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -r gateway/requirements.txt
      - run: npm --prefix orchestration/node-red ci
      - run: python -m unittest discover -s gateway -p 'test_*.py' -v
        env:
          LANGSMITH_TRACING: 'false'
